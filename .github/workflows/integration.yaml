name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      image_environment:
        description: "Default image tag"
        required: true
        type: choice
        options:
          - dev
          - latest
        default: dev

      backend_tag:
        description: "Optional backend image tag override"
        required: false
        type: string

      frontend_tag:
        description: "Optional frontend image tag override"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clusterscope-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clusterscope-frontend

jobs:

  integration-test:
    name: Full Stack Integration Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Resolve image tags
      # --------------------------------------------------

      - name: Resolve image tags
        run: |
          BACKEND_TAG="${{ inputs.backend_tag }}"
          FRONTEND_TAG="${{ inputs.frontend_tag }}"

          if [ -z "$BACKEND_TAG" ]; then
            BACKEND_TAG="${{ inputs.image_environment }}"
          fi

          if [ -z "$FRONTEND_TAG" ]; then
            FRONTEND_TAG="${{ inputs.image_environment }}"
          fi

          echo "Backend tag: $BACKEND_TAG"
          echo "Frontend tag: $FRONTEND_TAG"

          echo "BACKEND_TAG=$BACKEND_TAG" >> "$GITHUB_ENV"
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 3. Login to GHCR
      # --------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # --------------------------------------------------
      # 4. Pull application images
      # --------------------------------------------------

      - name: Pull Backend image
        run: |
          docker pull \
            "${BACKEND_IMAGE}:${BACKEND_TAG}"

      - name: Pull Frontend image
        run: |
          docker pull \
            "${FRONTEND_IMAGE}:${FRONTEND_TAG}"


      # --------------------------------------------------
      # 5. Pull infrastructure images
      # --------------------------------------------------

      - name: Pull Redis image
        run: |
          docker pull redis:7-alpine

      - name: Pull PostgreSQL image
        run: |
          docker pull postgres:16-alpine


      # --------------------------------------------------
      # 6. Create Docker network
      # --------------------------------------------------

      - name: Create Docker network
        run: |
          docker network create clusterscope-network


      # --------------------------------------------------
      # 7. Start Redis
      # --------------------------------------------------

      - name: Start Redis
        run: |
          docker run -d \
            --name clusterscope-redis \
            --network clusterscope-network \
            redis:7-alpine


      # --------------------------------------------------
      # 8. Start PostgreSQL
      # --------------------------------------------------

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name clusterscope-postgres \
            --network clusterscope-network \
            -e POSTGRES_USER=clusterscope \
            -e POSTGRES_PASSWORD=clusterscope \
            -e POSTGRES_DB=clusterscope \
            postgres:16-alpine


      # --------------------------------------------------
      # 9. Wait for PostgreSQL
      # --------------------------------------------------

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec clusterscope-postgres \
              pg_isready \
              -U clusterscope \
              -d clusterscope; then

              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL did not become ready."
          exit 1


      # --------------------------------------------------
      # 10. Test Redis
      # --------------------------------------------------

      - name: Test Redis
        run: |
          REDIS_RESULT=$(docker exec clusterscope-redis redis-cli ping)

          echo "Redis response: $REDIS_RESULT"

          if [ "$REDIS_RESULT" != "PONG" ]; then
            echo "Redis health check failed."
            exit 1
          fi

          echo "Redis is healthy."


      # --------------------------------------------------
      # 11. Start Backend
      # --------------------------------------------------

      - name: Start Backend
        run: |
          docker run -d \
            --name clusterscope-backend \
            --network clusterscope-network \
            -p 8000:8000 \
            -e POSTGRES_USER=clusterscope \
            -e POSTGRES_PASSWORD=clusterscope \
            -e POSTGRES_DB=clusterscope \
            -e POSTGRES_HOST=clusterscope-postgres \
            -e POSTGRES_PORT=5432 \
            "${BACKEND_IMAGE}:${BACKEND_TAG}"


      # --------------------------------------------------
      # 12. Wait for Backend
      # --------------------------------------------------

      - name: Wait for Backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent \
              http://localhost:8000/healthz; then

              echo
              echo "Backend is ready."
              exit 0
            fi

            echo "Waiting for Backend..."
            sleep 2
          done

          echo "Backend did not become ready."

          docker logs clusterscope-backend || true

          exit 1


      # --------------------------------------------------
      # 13. Start Frontend
      # --------------------------------------------------

      - name: Start Frontend
        run: |
          docker run -d \
            --name clusterscope-frontend \
            --network clusterscope-network \
            -p 8080:8080 \
            -e REDIS_HOST=clusterscope-redis \
            -e REDIS_PORT=6379 \
            -e BACKEND_URL=http://clusterscope-backend:8000 \
            "${FRONTEND_IMAGE}:${FRONTEND_TAG}"


      # --------------------------------------------------
      # 14. Wait for Frontend
      # --------------------------------------------------

      - name: Wait for Frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent \
              http://localhost:8080/healthz; then

              echo
              echo "Frontend is ready."
              exit 0
            fi

            echo "Waiting for Frontend..."
            sleep 2
          done

          echo "Frontend did not become ready."

          docker logs clusterscope-frontend || true

          exit 1


      # --------------------------------------------------
      # 15. Integration tests
      # --------------------------------------------------

      - name: Test Backend health
        run: |
          curl --fail-with-body \
            http://localhost:8000/healthz

          echo
          echo "Backend health check passed."


      - name: Test Backend readiness
        run: |
          curl --fail-with-body \
            http://localhost:8000/readyz

          echo
          echo "Backend readiness check passed."


      - name: Test Frontend health
        run: |
          curl --fail-with-body \
            http://localhost:8080/healthz

          echo
          echo "Frontend health check passed."


      - name: Test Frontend readiness
        run: |
          curl --fail-with-body \
            http://localhost:8080/readyz

          echo
          echo "Frontend readiness check passed."


      # --------------------------------------------------
      # 15.1 Frontend → Redis
      # --------------------------------------------------

      - name: Test Frontend to Redis
        run: |
          echo "Saving value through Frontend → Redis..."

          POST_RESPONSE=$(curl --fail-with-body \
            -X POST \
            http://localhost:8080/api/session/integration-test \
            -H "Content-Type: application/json" \
            -d '{"magicNumber":"42"}')

          echo "POST response:"
          echo "$POST_RESPONSE"

          echo "$POST_RESPONSE" | jq -e '
            .connected == true and
            .saved == true and
            .magicNumber == "42"
          ' > /dev/null

          echo "Redis save through Frontend passed."


          echo
          echo "Reading value through Frontend → Redis..."

          GET_RESPONSE=$(curl --fail-with-body \
            http://localhost:8080/api/session/integration-test)

          echo "GET response:"
          echo "$GET_RESPONSE"

          echo "$GET_RESPONSE" | jq -e '
            .connected == true and
            .found == true and
            .magicNumber == "42"
          ' > /dev/null

          echo "Redis read through Frontend passed."


      # --------------------------------------------------
      # 15.2 Frontend → Backend
      # --------------------------------------------------

      - name: Test Frontend to Backend
        run: |
          RESPONSE=$(curl --fail-with-body \
            http://localhost:8080/api/backend/status)

          echo "Backend response through Frontend:"
          echo "$RESPONSE"

          echo "$RESPONSE" | jq -e '
            .connected == true and
            .data != null
          ' > /dev/null

          echo "Frontend → Backend integration passed."


      # --------------------------------------------------
      # 15.3 Frontend → Backend → PostgreSQL
      # --------------------------------------------------

      - name: Test Frontend to Backend to PostgreSQL
        run: |
          echo "Saving value through Frontend → Backend → PostgreSQL..."

          POST_RESPONSE=$(curl --fail-with-body \
            -X POST \
            http://localhost:8080/api/backend/magic/integration-test \
            -H "Content-Type: application/json" \
            -d '{"magicValue":"42"}')

          echo "POST response:"
          echo "$POST_RESPONSE"

          echo "$POST_RESPONSE" | jq -e '
            .name == "integration-test" and
            .magicValue == "42"
          ' > /dev/null

          echo "PostgreSQL save through Backend passed."


          echo
          echo "Reading value through Frontend → Backend → PostgreSQL..."

          GET_RESPONSE=$(curl --fail-with-body \
            http://localhost:8080/api/backend/magic/integration-test)

          echo "GET response:"
          echo "$GET_RESPONSE"

          echo "$GET_RESPONSE" | jq -e '
            .name == "integration-test" and
            .magicValue == "42"
          ' > /dev/null

          echo "PostgreSQL read through Backend passed."


      # --------------------------------------------------
      # 16. Collect diagnostic information
      # --------------------------------------------------

      - name: Collect integration test result
        if: always()
        run: |
          {
            echo "======================================"
            echo "ClusterScope Integration Test"
            echo "======================================"
            echo
            echo "Environment: ${{ inputs.image_environment }}"
            echo "Backend tag: $BACKEND_TAG"
            echo "Frontend tag: $FRONTEND_TAG"
            echo
            echo "Containers:"
            docker ps -a
            echo
            echo "Network:"
            docker network inspect clusterscope-network
          } > integration-test-result.log


      - name: Collect container logs
        if: always()
        run: |
          {
            echo "======================================"
            echo "Frontend logs"
            echo "======================================"
            docker logs clusterscope-frontend 2>&1 || true

            echo
            echo "======================================"
            echo "Backend logs"
            echo "======================================"
            docker logs clusterscope-backend 2>&1 || true

            echo
            echo "======================================"
            echo "Redis logs"
            echo "======================================"
            docker logs clusterscope-redis 2>&1 || true

            echo
            echo "======================================"
            echo "PostgreSQL logs"
            echo "======================================"
            docker logs clusterscope-postgres 2>&1 || true
          } > integration-test-logs.log


      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-${{ github.run_id }}
          path: |
            integration-test-result.log
            integration-test-logs.log
          retention-days: 14


      # --------------------------------------------------
      # 17. Cleanup
      # --------------------------------------------------

      - name: Cleanup
        if: always()
        run: |
          docker rm -f \
            clusterscope-frontend \
            clusterscope-backend \
            clusterscope-postgres \
            clusterscope-redis || true

          docker network rm clusterscope-network || true