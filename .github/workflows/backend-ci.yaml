name: Backend CI/CD

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'backend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'


# ============================================================
# Workflow Environment
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clusterscope-backend


jobs:

  # ============================================================
  # Backend Validation
  # ============================================================

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest


  # ============================================================
  # Backend Static Security Analysis
  # ============================================================

  backend-sast:
    name: Backend SAST
    runs-on: ubuntu-latest

    needs: backend-validation

    permissions:
      security-events: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3


  # ============================================================
  # Backend Docker Build - AMD64
  #
  # Build only.
  # The image is loaded into Docker and exported as a
  # Docker archive for the smoke-test job.
  # ============================================================

  backend-build-amd64:
    name: Backend Build AMD64
    runs-on: ubuntu-latest

    needs: backend-sast

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Build AMD64 image
      # ----------------------------------------------------------

      - name: Build AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          platforms: linux/amd64

          load: true

          tags: |
            clusterscope-backend:smoke

          cache-from: |
            type=gha,scope=clusterscope-backend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-backend


      # ----------------------------------------------------------
      # Export Docker image
      #
      # docker save creates a Docker-compatible archive.
      # This can safely be loaded with docker load in another job.
      # ----------------------------------------------------------

      - name: Save Docker image
        run: |
          docker save \
            clusterscope-backend:smoke \
            -o /tmp/clusterscope-backend.tar


      # ----------------------------------------------------------
      # Upload Docker image artifact
      # ----------------------------------------------------------

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/clusterscope-backend.tar
          retention-days: 1


  # ============================================================
  # Backend Smoke Test
  #
  # Download → Load → Run → Test
  # ============================================================

  backend-smoke-test:
    name: Backend Smoke Test
    runs-on: ubuntu-latest

    needs: backend-build-amd64

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Download Docker image
      # ----------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image


      # ----------------------------------------------------------
      # Load Docker image
      # ----------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/clusterscope-backend.tar


      # ----------------------------------------------------------
      # Run container
      # ----------------------------------------------------------

      - name: Start backend container
        run: |
          docker run -d \
            --name clusterscope-backend \
            -p 8000:8000 \
            clusterscope-backend:smoke


      # ----------------------------------------------------------
      # Smoke test
      # ----------------------------------------------------------

      - name: Smoke test backend
        run: |
          echo "Waiting for application..."

          sleep 3

          curl --fail \
            --retry 5 \
            --retry-delay 1 \
            http://localhost:8000/healthz


      # ----------------------------------------------------------
      # Collect smoke test result
      # ----------------------------------------------------------

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Backend Smoke Test"
            echo "=================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:8000/healthz || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=clusterscope-backend
            echo ""
            echo "Container inspect:"
            docker inspect clusterscope-backend \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > backend-smoke-test.log


      # ----------------------------------------------------------
      # Collect Docker logs
      # ----------------------------------------------------------

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope-backend \
            > backend-docker.log 2>&1 || true


      # ----------------------------------------------------------
      # Upload smoke-test artifacts
      # ----------------------------------------------------------

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-test-${{ github.run_id }}
          path: |
            backend-smoke-test.log
            backend-docker.log
          retention-days: 14


      # ----------------------------------------------------------
      # Cleanup
      # ----------------------------------------------------------

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope-backend || true


  # ============================================================
  # Backend Publish
  #
  # Smoke test passed
  #       ↓
  # QEMU
  #       ↓
  # Multi-Arch Build
  #       ↓
  # Push Candidate
  #
  # Platforms:
  #   linux/amd64
  #   linux/arm64
  # ============================================================

  backend-publish:
    name: Backend Publish
    runs-on: ubuntu-latest

    needs: backend-smoke-test

    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.push == true
      )

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Set up QEMU
      #
      # Required for ARM64 build.
      # ----------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ----------------------------------------------------------
      # Set image tags
      # ----------------------------------------------------------

      - name: Set image tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=candidate-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Build + Push Multi-Platform Candidate
      # ----------------------------------------------------------

      - name: Build and push candidate image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          cache-from: |
            type=gha,scope=clusterscope-backend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-backend


  # ============================================================
  # Backend Promote
  #
  # Candidate → Environment Tag
  #
  # No rebuild.
  # ============================================================

  backend-promote:
    name: Backend Promote
    runs-on: ubuntu-latest

    needs: backend-publish

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ----------------------------------------------------------
      # Set image tags
      # ----------------------------------------------------------

      - name: Set image tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=candidate-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"


      # ==========================================================
      # Promote → Dev
      #
      # feat/* → dev
      # workflow_dispatch + push=true → dev
      # ==========================================================

      - name: Promote candidate to dev
        if: |
          (
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/heads/feat/')
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.push == true
          )
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:dev" \
            "${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}"

          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}"


      # ==========================================================
      # Promote → Latest
      #
      # main → latest
      # ==========================================================

      - name: Promote candidate to latest
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            "${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}"

          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}"