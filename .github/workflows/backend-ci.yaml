name: Backend CI

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'backend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'


# ============================================================
# Workflow Environment
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clusterscope-backend


jobs:

  # ============================================================
  # Backend Validation
  # ============================================================

  code-validation:
    name: Code Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest


  # ============================================================
  # Backend Static Security Analysis
  # ============================================================

  code-sast:
    name: Code SAST
    runs-on: ubuntu-latest


    permissions:
      security-events: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3


  # ============================================================
  # Trivy Configuration Scan
  #
  # Scans Dockerfile and other configuration files before
  # building the container image.
  #
  # This detects configuration / security misconfigurations.
  # ============================================================

  trivy-image-config-scan:
    name: Trivy Image Config Scan
    runs-on: ubuntu-latest


    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Run Trivy configuration scan
      # ----------------------------------------------------------

      - name: Scan backend configuration with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./backend
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: trivy-config-report.txt


      # ----------------------------------------------------------
      # Upload Trivy configuration report
      #
      # Upload even if the scan fails.
      # ----------------------------------------------------------

      - name: Upload Trivy config report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-config-${{ github.run_id }}
          path: trivy-config-report.txt
          retention-days: 14


  # ============================================================
  # Image Docker Build - AMD64
  #
  # Waits for:
  #
  #   Image SAST
  #          +
  #   Trivy Config Scan
  #
  # Build only.
  # The image is loaded into Docker and exported as a
  # Docker archive for the following security and smoke-test jobs.
  # ============================================================

  image-build-amd64:
    name: Image Build AMD64
    runs-on: ubuntu-latest

    needs:
      - code-validation
      - code-sast
      - trivy-image-config-scan

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Build AMD64 image
      # ----------------------------------------------------------

      - name: Build AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          platforms: linux/amd64

          load: true

          tags: |
            clusterscope-backend:smoke

          cache-from: |
            type=gha,scope=clusterscope-backend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-backend


      # ----------------------------------------------------------
      # Export Docker image
      #
      # docker save creates a Docker-compatible archive.
      # This can safely be loaded with docker load in another job.
      # ----------------------------------------------------------

      - name: Save Docker image
        run: |
          docker save \
            clusterscope-backend:smoke \
            -o /tmp/clusterscope-backend.tar


      # ----------------------------------------------------------
      # Upload Docker image artifact
      # ----------------------------------------------------------

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/clusterscope-backend.tar
          retention-days: 1


  # ============================================================
  # Backend Container Image Security Scan
  #
  # Download → Load → Trivy Scan
  #
  # Scans the exact AMD64 image that will later be used
  # by the smoke-test job.
  #
  # The scan fails if HIGH or CRITICAL vulnerabilities
  # are detected.
  # ============================================================

  image-trivy-vulnerability-scan:
    name: Image Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    needs: image-build-amd64

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Download Docker image artifact
      # ----------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image


      # ----------------------------------------------------------
      # Load Docker image
      # ----------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/clusterscope-backend.tar


      # ----------------------------------------------------------
      # Run Trivy vulnerability scan
      # ----------------------------------------------------------

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clusterscope-backend:smoke
          format: table
          output: trivy-image-report.txt
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


      # ----------------------------------------------------------
      # Upload Trivy vulnerability report
      #
      # Upload even if the scan fails.
      # ----------------------------------------------------------

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-image-${{ github.run_id }}
          path: trivy-image-report.txt
          retention-days: 14


  # ============================================================
  # Backend Smoke Test
  #
  # Download → Load → Run → Test
  #
  # This runs only after:
  #
  #   Build
  #       ↓
  #   Trivy Image Scan
  #
  # has passed.
  # ============================================================

  image-smoke-test:
    name: Image Smoke Test
    runs-on: ubuntu-latest

    needs: image-build-amd64

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Download Docker image
      # ----------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image


      # ----------------------------------------------------------
      # Load Docker image
      # ----------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/clusterscope-backend.tar


      # ----------------------------------------------------------
      # Start backend container
      # ----------------------------------------------------------

      - name: Start backend container
        run: |
          docker run -d \
            --name clusterscope-backend \
            -p 8000:8000 \
            clusterscope-backend:smoke


      # ----------------------------------------------------------
      # Smoke test
      # ----------------------------------------------------------

      - name: Smoke test backend
        run: |
          echo "Waiting for application..."

          sleep 3

          curl --fail \
            --retry 5 \
            --retry-delay 1 \
            http://localhost:8000/healthz


      # ----------------------------------------------------------
      # Collect smoke test result
      # ----------------------------------------------------------

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Backend Smoke Test"
            echo "=================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:8000/healthz || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=clusterscope-backend
            echo ""
            echo "Container inspect:"
            docker inspect clusterscope-backend \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > backend-smoke-test.log


      # ----------------------------------------------------------
      # Collect Docker logs
      # ----------------------------------------------------------

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope-backend \
            > backend-docker.log 2>&1 || true


      # ----------------------------------------------------------
      # Upload smoke-test artifacts
      # ----------------------------------------------------------

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-test-${{ github.run_id }}
          path: |
            backend-smoke-test.log
            backend-docker.log
          retention-days: 14


      # ----------------------------------------------------------
      # Cleanup
      # ----------------------------------------------------------

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope-backend || true


  # ============================================================
  # Backend Image Push
  #
  # Environment:
  #
  #   main    → production → latest
  #   feat/** → development → dev
  #
  # Multi-Architecture:
  #
  #   linux/amd64
  #   linux/arm64
  #
  # Tags:
  #
  #   Moving environment tag:
  #     dev
  #     latest
  #
  #   Fixed human-readable tag:
  #     dev-142-a1b2c3d
  #     latest-143-f8e91ab
  #
  # The image digest identifies the exact immutable image.
  # ============================================================

  image-push:
    name: Image Push
    runs-on: ubuntu-latest

    needs:
      - image-smoke-test
      - image-trivy-vulnerability-scan

    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.push == true
      )

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Set up QEMU
      #
      # Required for ARM64 builds.
      # ----------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # ----------------------------------------------------------
      # Set up Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ----------------------------------------------------------
      # Set image version
      #
      # Example:
      #
      #   142-a1b2c3d
      #
      # The environment tag is added during the Docker build:
      #
      #   dev-142-a1b2c3d
      #   latest-142-a1b2c3d
      # ----------------------------------------------------------

      - name: Set image version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_VERSION=${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Build and push multi-architecture image
      #
      # Moving tag:
      #
      #   dev
      #   latest
      #
      # Fixed tag:
      #
      #   dev-142-a1b2c3d
      #   latest-142-a1b2c3d
      #
      # Both tags point to the same image digest.
      # ----------------------------------------------------------

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ vars.ENV_IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ vars.ENV_IMAGE_TAG }}-${{ env.IMAGE_VERSION }}

          cache-from: |
            type=gha,scope=clusterscope-backend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-backend


      # ----------------------------------------------------------
      # Display image digest
      #
      # The digest identifies the exact immutable
      # multi-architecture image.
      # ----------------------------------------------------------

      - name: Display image digest
        run: |
          echo "Environment tag:"
          echo "${{ env.IMAGE_NAME }}:${{ vars.ENV_IMAGE_TAG }}"

          echo "Version tag:"
          echo "${{ env.IMAGE_NAME }}:${{ vars.ENV_IMAGE_TAG }}-${{ env.IMAGE_VERSION }}"

          echo "Digest:"
          echo "${{ steps.build.outputs.digest }}"