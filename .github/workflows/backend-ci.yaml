name: Backend CI/CD

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'backend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'


# ============================================================
# Workflow Environment
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clusterscope-backend


jobs:

  # ============================================================
  # Backend Validation
  # ============================================================

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest



  # ============================================================
  # Backend Static Security Analysis
  # ============================================================

  backend-sast:
    name: Backend SAST
    runs-on: ubuntu-latest

    needs: backend-validation

    permissions:
      security-events: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ============================================================
  # Backend Image
  #
  # Build amd64 → Smoke Test → Build Multi-Arch → Push Candidate
  # ============================================================

  backend-image:
    name: Backend Image
    runs-on: ubuntu-latest

    needs: backend-sast

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ----------------------------------------------------------
      # Set image tags
      # ----------------------------------------------------------

      - name: Set image tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=candidate-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"


      # ==========================================================
      # Build amd64 Image for Smoke Test
      #
      # Single platform
      # No push
      # load: true
      #
      # The image is loaded into the local Docker Engine.
      # ==========================================================

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          platforms: linux/amd64

          load: true

          tags: |
            clusterscope-backend:smoke

          cache-from: |
            type=gha,scope=clusterscope-backend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-backend


      # ==========================================================
      # Smoke Test
      # ==========================================================

      - name: Smoke test backend image
        run: |
          docker run -d \
            --name clusterscope-backend \
            -p 8000:8000 \
            clusterscope-backend:smoke

          echo "Waiting for application..."

          sleep 3

          curl --fail \
            --retry 5 \
            --retry-delay 1 \
            http://localhost:8000/healthz


      # ==========================================================
      # Collect Smoke Test Result
      # ==========================================================

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Backend Smoke Test"
            echo "=================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:8000/healthz || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=clusterscope-backend
            echo ""
            echo "Container inspect:"
            docker inspect clusterscope-backend \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > backend-smoke-test.log


      # ==========================================================
      # Collect Docker Logs
      # ==========================================================

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope-backend \
            > backend-docker.log 2>&1 || true


      # ==========================================================
      # Upload Smoke Test Artifacts
      # ==========================================================

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-test-${{ github.run_id }}
          path: |
            backend-smoke-test.log
            backend-docker.log
          retention-days: 14


      # ==========================================================
      # Cleanup Smoke Test Container
      # ==========================================================

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope-backend || true


      # ==========================================================
      # Set up QEMU
      #
      # Needed only now because the next build targets ARM64.
      # ==========================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # ==========================================================
      # Build + Push Multi-Platform Candidate
      #
      # Only reached if the smoke test succeeded.
      #
      # Platforms:
      #   linux/amd64
      #   linux/arm64
      # ==========================================================

      - name: Build and push candidate image
        if: |
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.push == true
          )
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          cache-from: |
            type=gha,scope=clusterscope-backend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-backend


      # ==========================================================
      # Promote Candidate → Dev
      #
      # feat/* → dev
      # workflow_dispatch + push=true → dev
      #
      # No rebuild.
      # ==========================================================

      - name: Promote candidate to dev
        if: |
          success() &&
          (
            (
              github.event_name == 'push' &&
              startsWith(github.ref, 'refs/heads/feat/')
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.push == true
            )
          )
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:dev \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}


      # ==========================================================
      # Promote Candidate → Latest
      #
      # main → latest
      #
      # No rebuild.
      # ==========================================================

      - name: Promote candidate to latest
        if: |
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}


      # ==========================================================
      # Cleanup
      # ==========================================================

      - name: Final cleanup
        if: always()
        run: |
          docker rm -f clusterscope-backend || true