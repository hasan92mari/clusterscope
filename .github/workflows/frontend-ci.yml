name: Frontend CI/CD

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'frontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'


jobs:

  # ============================================================
  # Frontend Validation
  # ============================================================

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Add tests later
      # - name: Test
      #   run: npm test


  # ============================================================
  # Frontend Containerization
  # ============================================================

  frontend-containerization:
    name: Frontend Containerization
    runs-on: ubuntu-latest

    needs: frontend-validation

    # Containerization happens:
    # - Pull Request to main -> build + smoke test only
    # - Push to feat/**       -> build + smoke test + push :dev
    # - Push to main          -> build + smoke test + push :latest
    # - Manual push=true      -> build + smoke test + push :dev
    #
    # Manual push=false does not push an image.

    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="v${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${IMAGE_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # Build image for smoke test
      # ========================================================

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          platforms: linux/amd64
          tags: clusterscope-frontend:test

      - name: Smoke test
        run: |
          docker run -d \
            --name clusterscope \
            -p 8080:8080 \
            clusterscope-frontend:test

          sleep 3

          curl --fail http://localhost:8080/healthz

      - name: Read container logs on failure
        if: failure()
        run: docker logs clusterscope

      - name: Cleanup container
        if: always()
        run: docker rm -f clusterscope

      # ========================================================
      # Push development image
      # ========================================================

      - name: Push development image
        if: |
          (github.event_name == 'push' &&
           startsWith(github.ref, 'refs/heads/feat/')) ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.push == true)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/clusterscope-frontend:dev

      # ========================================================
      # Push production image
      # ========================================================

      - name: Push latest image
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/clusterscope-frontend:${{ steps.image-tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/clusterscope-frontend:latest