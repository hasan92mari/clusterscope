name: Frontend CI

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'frontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'


# ============================================================
# Workflow Environment
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clusterscope-frontend


jobs:

  # ============================================================
  # Frontend Validation
  # ============================================================

  code-validation:
    name: Code Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build


  # ============================================================
  # Frontend Static Security Analysis
  # ============================================================

  code-sast:
    name: Code SAST
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3


  # ============================================================
  # Trivy Configuration Scan
  # ============================================================

  trivy-image-config-scan:
    name: Trivy Image Config Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Dockerfile with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./frontend
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table


  # ============================================================
  # Frontend Docker Build - AMD64
  #
  # Build only.
  # The image is loaded into Docker and exported as a
  # Docker archive for the smoke-test job.
  # ============================================================

  image-build-amd64:
    name: Image Build AMD64
    runs-on: ubuntu-latest

    needs: 
      - trivy-image-config-scan
      - code-validation
      - code-sast

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Build AMD64 image
      # ----------------------------------------------------------

      - name: Build AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: linux/amd64

          load: true

          tags: |
            clusterscope-frontend:smoke

          cache-from: |
            type=gha,scope=clusterscope-frontend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-frontend


      # ----------------------------------------------------------
      # Export Docker image
      #
      # docker save creates a Docker-compatible archive.
      # This can safely be loaded with docker load in another job.
      # ----------------------------------------------------------

      - name: Save Docker image
        run: |
          docker save \
            clusterscope-frontend:smoke \
            -o /tmp/clusterscope-frontend.tar


      # ----------------------------------------------------------
      # Upload Docker image artifact
      # ----------------------------------------------------------

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ github.run_id }}
          path: /tmp/clusterscope-frontend.tar
          retention-days: 1





  # ============================================================
  # Frontend Smoke Test
  #
  # Download → Load → Run → Test
  # ============================================================

  image-smoke-test:
    name: Image Smoke Test
    runs-on: ubuntu-latest

    needs: image-build-amd64

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Download Docker image
      # ----------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ github.run_id }}
          path: /tmp/frontend-image


      # ----------------------------------------------------------
      # Load Docker image
      # ----------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/frontend-image/clusterscope-frontend.tar


      # ----------------------------------------------------------
      # Start container
      # ----------------------------------------------------------

      - name: Start frontend container
        run: |
          docker run -d \
            --name clusterscope \
            -p 8080:8080 \
            clusterscope-frontend:smoke


      # ----------------------------------------------------------
      # Smoke test
      # ----------------------------------------------------------

      - name: Smoke test frontend
        run: |
          echo "Waiting for application..."

          sleep 3

          curl --fail \
            --retry 5 \
            --retry-delay 1 \
            http://localhost:8080/healthz


      # ----------------------------------------------------------
      # Collect smoke test result
      # ----------------------------------------------------------

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Frontend Smoke Test"
            echo "==================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:8080/healthz || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=clusterscope
            echo ""
            echo "Container inspect:"
            docker inspect clusterscope \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > frontend-smoke-test.log


      # ----------------------------------------------------------
      # Collect Docker logs
      # ----------------------------------------------------------

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope \
            > frontend-docker.log 2>&1 || true


      # ----------------------------------------------------------
      # Upload smoke-test artifacts
      # ----------------------------------------------------------

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-test-${{ github.run_id }}
          path: |
            frontend-smoke-test.log
            frontend-docker.log
          retention-days: 14


      # ----------------------------------------------------------
      # Cleanup
      # ----------------------------------------------------------

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope || true


  # ============================================================
  # Frontend Container Image Security Scan
  #
  # Download → Load → Trivy Scan
  #
  # The same AMD64 image that will be used for the smoke test
  # is scanned for known vulnerabilities.
  # ============================================================

  image-trivy-vulnerability-scan:
    name: Image Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    needs: image-build-amd64

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Download Docker image artifact
      # ----------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ github.run_id }}
          path: /tmp/frontend-image


      # ----------------------------------------------------------
      # Load Docker image
      # ----------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/frontend-image/clusterscope-frontend.tar


      # ----------------------------------------------------------
      # Run Trivy vulnerability scan
      #
      # The scan fails if HIGH or CRITICAL vulnerabilities
      # are detected.
      # ----------------------------------------------------------

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clusterscope-frontend:smoke
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH




  # ============================================================
  # Backend DAST - OWASP ZAP
  #
  # Download → Load → Run → ZAP Scan
  #
  # The application is started from the exact AMD64 image
  # that was built, scanned and smoke-tested.
  # ============================================================

  image-dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest

    needs:
      - image-smoke-test
      - image-trivy-vulnerability-scan

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Download Docker image artifact
      # ----------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image


      # ----------------------------------------------------------
      # Load Docker image
      # ----------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/clusterscope-backend.tar


      # ----------------------------------------------------------
      # Start backend
      # ----------------------------------------------------------

      - name: Start backend container
        run: |
          docker run -d \
            --name clusterscope-backend \
            -p 8000:8000 \
            clusterscope-backend:smoke


      # ----------------------------------------------------------
      # Wait for backend
      # ----------------------------------------------------------

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."

          curl --fail \
            --retry 10 \
            --retry-delay 2 \
            http://localhost:8000/healthz


      # ----------------------------------------------------------
      # OWASP ZAP Baseline Scan
      #
      # Baseline scan performs passive security testing.
      # It does not actively attack the application.
      # ----------------------------------------------------------

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            --network host \
            -v "$(pwd):/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -r zap-report.html \
            -J zap-report.json \
            -I


      # ----------------------------------------------------------
      # Upload ZAP reports
      # ----------------------------------------------------------

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-zap-${{ github.run_id }}
          path: |
            zap-report.html
            zap-report.json
          retention-days: 14


      # ----------------------------------------------------------
      # Collect Docker logs
      # ----------------------------------------------------------

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope-backend \
            > backend-zap-docker.log 2>&1 || true


      # ----------------------------------------------------------
      # Cleanup
      # ----------------------------------------------------------

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope-backend || true

  # ============================================================
  # Frontend Image Push
  #
  # Environment:
  #
  #   main    → production → latest
  #   feat/** → development → dev
  #
  # Multi-Architecture:
  #
  #   linux/amd64
  #   linux/arm64
  #
  # The image is pushed directly to the environment tag.
  # ============================================================

  frontend-image-push:
    name: Frontend Image Push
    runs-on: ubuntu-latest

    needs:
      - image-trivy-vulnerability-scan
      - image-dast

    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.push == true
      )

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Set up QEMU
      #
      # Required for ARM64 builds.
      # ----------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # ----------------------------------------------------------
      # Set up Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ----------------------------------------------------------
      # Build and push multi-architecture image
      #
      # Environment variable:
      #
      #   development → dev
      #   production  → latest
      # ----------------------------------------------------------

      - name: Set image version tags

        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_VERSION=${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ vars.ENV_IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ vars.ENV_IMAGE_TAG }}-${{ env.IMAGE_VERSION }}

          cache-from: |
            type=gha,scope=clusterscope-frontend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-frontend


      # ----------------------------------------------------------
      # Display image digest
      #
      # The digest identifies the exact immutable image.
      # ----------------------------------------------------------

      - name: Display image digest
        run: |
          echo "Environment tag:"
          echo "${{ env.IMAGE_NAME }}:${{ vars.ENV_IMAGE_TAG }}"

          echo "Version tag:"
          echo "${{ env.IMAGE_NAME }}:${{ vars.ENV_IMAGE_TAG }}-${{ env.IMAGE_VERSION }}"

          echo "Digest:"
          echo "${{ steps.build.outputs.digest }}"