name: Frontend CI/CD

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'frontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clusterscope-frontend


jobs:

  # ============================================================
  # Frontend Validation
  # ============================================================

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build


  # ============================================================
  # Frontend Image
  #
  # Build amd64 → Smoke Test → Build Multi-Arch → Push Candidate
  # ============================================================

  frontend-image:
    name: Frontend Image
    runs-on: ubuntu-latest

    needs: frontend-validation

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ----------------------------------------------------------
      # Set image tags
      # ----------------------------------------------------------

      - name: Set image tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=candidate-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"


      # ==========================================================
      # Build amd64 Image for Smoke Test
      #
      # Single platform
      # No push
      # load: true
      #
      # The image is loaded into the local Docker Engine so it
      # can be started and tested immediately.
      # ==========================================================

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: linux/amd64

          load: true

          tags: |
            clusterscope-frontend:smoke

          cache-from: |
            type=gha,scope=clusterscope-frontend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-frontend


      # ==========================================================
      # Smoke Test
      # ==========================================================

      - name: Smoke test candidate image
        run: |
          docker run -d \
            --name clusterscope \
            -p 8080:8080 \
            clusterscope-frontend:smoke

          echo "Waiting for application..."

          sleep 3

          curl --fail \
            --retry 5 \
            --retry-delay 1 \
            http://localhost:8080/healthz


      # ==========================================================
      # Collect Smoke Test Result
      # ==========================================================

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Frontend Smoke Test"
            echo "==================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:8080/healthz || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=clusterscope
            echo ""
            echo "Container inspect:"
            docker inspect clusterscope \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > frontend-smoke-test.log


      # ==========================================================
      # Collect Docker Logs
      # ==========================================================

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope \
            > frontend-docker.log 2>&1 || true


      # ==========================================================
      # Upload Smoke Test Artifacts
      # ==========================================================

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-test-${{ github.run_id }}
          path: |
            frontend-smoke-test.log
            frontend-docker.log
          retention-days: 14


      # ==========================================================
      # Cleanup Smoke Test Container
      # ==========================================================

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope || true


      # ==========================================================
      # QEMU
      #
      # Needed only now because the next build targets ARM64.
      # ==========================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # ==========================================================
      # Build + Push Multi-Platform Candidate
      #
      # This step is reached only if the smoke test succeeded.
      #
      # Platforms:
      #   linux/amd64
      #   linux/arm64
      #
      # This is the image that will later be promoted.
      # ==========================================================

      - name: Build and push candidate image
        if: |
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.push == true
          )
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          cache-from: |
            type=gha,scope=clusterscope-frontend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-frontend


      # ==========================================================
      # Promote Candidate → Dev
      #
      # feat/* → dev
      # workflow_dispatch + push=true → dev
      #
      # No rebuild.
      # The multi-platform candidate manifest is reused.
      # ==========================================================

      - name: Promote candidate to dev
        if: |
          success() &&
          (
            (
              github.event_name == 'push' &&
              startsWith(github.ref, 'refs/heads/feat/')
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.push == true
            )
          )
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:dev \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}


      # ==========================================================
      # Promote Candidate → Latest
      #
      # main → latest
      #
      # No rebuild.
      # ==========================================================

      - name: Promote candidate to latest
        if: |
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}