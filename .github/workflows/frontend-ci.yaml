name: Frontend CI

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'frontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'


# ============================================================
# Workflow Environment
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clusterscope-frontend


jobs:

  # ============================================================
  # Frontend Validation
  # ============================================================

  code-validation:
    name: Code Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build


  # ============================================================
  # Frontend Static Security Analysis
  # ============================================================

  code-sast:
    name: Code SAST
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3


  # ============================================================
  # Trivy Configuration Scan
  # ============================================================

  trivy-image-config-scan:
    name: Trivy Image Config Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Dockerfile with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./frontend
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table


  # ============================================================
  # Frontend Docker Build - AMD64
  #
  # Build only.
  # The image is loaded into Docker and exported as a
  # Docker archive for the smoke-test job.
  # ============================================================

  image-build-amd64:
    name: Image Build AMD64
    runs-on: ubuntu-latest

    needs: 
      - trivy-image-config-scan
      - code-validation
      - code-sast

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Build AMD64 image
      # ----------------------------------------------------------

      - name: Build AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: linux/amd64

          load: true

          tags: |
            clusterscope-frontend:smoke

          cache-from: |
            type=gha,scope=clusterscope-frontend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-frontend


      # ----------------------------------------------------------
      # Export Docker image
      #
      # docker save creates a Docker-compatible archive.
      # This can safely be loaded with docker load in another job.
      # ----------------------------------------------------------

      - name: Save Docker image
        run: |
          docker save \
            clusterscope-frontend:smoke \
            -o /tmp/clusterscope-frontend.tar


      # ----------------------------------------------------------
      # Upload Docker image artifact
      # ----------------------------------------------------------

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ github.run_id }}
          path: /tmp/clusterscope-frontend.tar
          retention-days: 1

  # ============================================================
  # Frontend Container Image Security Scan
  #
  # Download → Load → Trivy Scan
  #
  # The same AMD64 image that will be used for the smoke test
  # is scanned for known vulnerabilities.
  # ============================================================

  image-trivy-vulnerability-scan:
    name: Image Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    needs: image-build-amd64

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Download Docker image artifact
      # ----------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ github.run_id }}
          path: /tmp/frontend-image


      # ----------------------------------------------------------
      # Load Docker image
      # ----------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/frontend-image/clusterscope-frontend.tar


      # ----------------------------------------------------------
      # Run Trivy vulnerability scan
      #
      # The scan fails if HIGH or CRITICAL vulnerabilities
      # are detected.
      # ----------------------------------------------------------

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clusterscope-frontend:smoke
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH




  # ============================================================
  # Frontend Smoke Test
  #
  # Download → Load → Run → Test
  # ============================================================

  image-smoke-test:
    name: Image Smoke Test
    runs-on: ubuntu-latest

    needs: image-build-amd64

    permissions:
      contents: read

    steps:

      # ----------------------------------------------------------
      # Download Docker image
      # ----------------------------------------------------------

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image-${{ github.run_id }}
          path: /tmp/frontend-image


      # ----------------------------------------------------------
      # Load Docker image
      # ----------------------------------------------------------

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/frontend-image/clusterscope-frontend.tar


      # ----------------------------------------------------------
      # Start container
      # ----------------------------------------------------------

      - name: Start frontend container
        run: |
          docker run -d \
            --name clusterscope \
            -p 8080:8080 \
            clusterscope-frontend:smoke


      # ----------------------------------------------------------
      # Smoke test
      # ----------------------------------------------------------

      - name: Smoke test frontend
        run: |
          echo "Waiting for application..."

          sleep 3

          curl --fail \
            --retry 5 \
            --retry-delay 1 \
            http://localhost:8080/healthz


      # ----------------------------------------------------------
      # Collect smoke test result
      # ----------------------------------------------------------

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Frontend Smoke Test"
            echo "==================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:8080/healthz || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=clusterscope
            echo ""
            echo "Container inspect:"
            docker inspect clusterscope \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > frontend-smoke-test.log


      # ----------------------------------------------------------
      # Collect Docker logs
      # ----------------------------------------------------------

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope \
            > frontend-docker.log 2>&1 || true


      # ----------------------------------------------------------
      # Upload smoke-test artifacts
      # ----------------------------------------------------------

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-test-${{ github.run_id }}
          path: |
            frontend-smoke-test.log
            frontend-docker.log
          retention-days: 14


      # ----------------------------------------------------------
      # Cleanup
      # ----------------------------------------------------------

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope || true




  # ============================================================
  # Frontend Publish
  #
  #       ↓
  # QEMU
  #       ↓
  # Multi-Arch Build
  #       ↓
  # Push Candidate
  #
  # Platforms:
  #   linux/amd64
  #   linux/arm64
  # ============================================================

  image-publish:
    name: Image Publish
    runs-on: ubuntu-latest

    needs: 
      - image-smoke-test
      - image-trivy-vulnerability-scan

    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.push == true
      )

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Set up QEMU
      #
      # Required for ARM64 build.
      # ----------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ----------------------------------------------------------
      # Set image tags
      # ----------------------------------------------------------

      - name: Set image tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=candidate-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # Build + Push Multi-Platform Candidate
      # ----------------------------------------------------------

      - name: Build and push candidate image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          cache-from: |
            type=gha,scope=clusterscope-frontend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-frontend


  # ============================================================
  # Frontend Promote
  #
  # Candidate → Environment Tag
  #
  # No rebuild.
  # ============================================================

  image-promote:
    name: Image Promote
    runs-on: ubuntu-latest

    needs: image-publish

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ----------------------------------------------------------
      # Set image tags
      # ----------------------------------------------------------

      - name: Set image tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=candidate-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"


      # ==========================================================
      # Promote → Dev
      #
      # feat/* → dev
      # workflow_dispatch + push=true → dev
      # ==========================================================

      - name: Promote candidate to dev
        if: |
          (
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/heads/feat/')
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.push == true
          )
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:dev" \
            "${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}"

          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}"


      # ==========================================================
      # Promote → Latest
      #
      # main → latest
      # ==========================================================

      - name: Promote candidate to latest
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            "${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}"

          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            "${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}"