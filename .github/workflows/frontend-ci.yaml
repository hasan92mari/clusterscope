name: Frontend CI/CD

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'frontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clusterscope-frontend
  IMAGE_TAG: "v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
  CANDIDATE_TAG: "candidate-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"


jobs:

  # ============================================================
  # Frontend Validation
  # ============================================================

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build


  # ============================================================
  # Frontend Image
  #
  # Build → Push Candidate → Smoke Test → Promote
  # ============================================================

  frontend-image:
    name: Frontend Image
    runs-on: ubuntu-latest

    needs: frontend-validation

    if: |
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.push == true
      )

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # QEMU
      # ----------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3


      # ----------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}


      # ==========================================================
      # Build + Push Candidate
      #
      # The image is built ONCE.
      #
      # Platforms:
      #   linux/amd64
      #   linux/arm64
      # ==========================================================

      - name: Build and push candidate image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          cache-from: |
            type=gha,scope=clusterscope-frontend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-frontend


      # ==========================================================
      # Pull Candidate
      #
      # GitHub runner is amd64.
      # Docker automatically pulls the amd64 variant.
      # ==========================================================

      - name: Pull candidate image
        run: |
          docker pull \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}


      # ==========================================================
      # Smoke Test
      # ==========================================================

      - name: Smoke test candidate image
        run: |
          docker run -d \
            --name clusterscope \
            -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          echo "Waiting for application..."

          sleep 3

          curl --fail \
            --retry 5 \
            --retry-delay 1 \
            http://localhost:8080/healthz


      # ==========================================================
      # Collect Smoke Test Result
      # ==========================================================

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Frontend Smoke Test"
            echo "==================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:8080/healthz || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=clusterscope
            echo ""
            echo "Container inspect:"
            docker inspect clusterscope \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > frontend-smoke-test.log


      # ==========================================================
      # Collect Docker Logs
      # ==========================================================

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope \
            > frontend-docker.log 2>&1 || true


      # ==========================================================
      # Upload Smoke Test Artifacts
      # ==========================================================

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-test-${{ github.run_id }}
          path: |
            frontend-smoke-test.log
            frontend-docker.log
          retention-days: 14


      # ==========================================================
      # Promote Candidate → Dev
      #
      # No rebuild.
      # Only creates another tag pointing to the same
      # multi-platform image.
      # ==========================================================

      - name: Promote candidate to dev
        if: |
          success() &&
          (
            (
              github.event_name == 'push' &&
              startsWith(github.ref, 'refs/heads/feat/')
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.push == true
            )
          )
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:dev \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}


      # ==========================================================
      # Promote Candidate → Latest
      # ==========================================================

      - name: Promote candidate to latest
        if: |
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}

          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:${{ env.CANDIDATE_TAG }}


      # ==========================================================
      # Cleanup
      # ==========================================================

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope || true