name: Backend CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'backend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'


jobs:

  # ============================================================
  # Backend Validation
  # ============================================================

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest


  # ============================================================
  # Backend Containerization
  # ============================================================

  backend-containerization:
    name: Backend Containerization
    runs-on: ubuntu-latest

    needs: backend-validation

    # Containerization happens:
    # - On Pull Requests to main -> build + smoke test only
    # - On pushes to main       -> build + smoke test + push
    #
    # Feature branch pushes do NOT containerize.

    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="v${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${IMAGE_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build image for smoke test
      # --------------------------------------------------------

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          platforms: linux/amd64
          tags: clusterscope-backend:test

      - name: Smoke test
        run: |
          docker run -d \
            --name clusterscope-backend \
            -p 8000:8000 \
            clusterscope-backend:test

          sleep 3

          curl --fail http://localhost:8000/healthz

      - name: Cleanup container
        if: always()
        run: docker rm -f clusterscope-backend

      # ========================================================
      # Push image after merge to main
      # ========================================================

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/clusterscope-backend:${{ steps.image-tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/clusterscope-backend:latest