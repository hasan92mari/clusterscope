name: Backend CI/CD

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push Docker image to GHCR"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'backend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'


# ============================================================
# Workflow Environment
# ============================================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/clusterscope-backend
  IMAGE_TAG: "v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"


jobs:

  # ============================================================
  # Backend Validation
  # ============================================================

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest


  # ============================================================
  # Backend Image Build
  # ============================================================

  backend-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    needs: backend-validation

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build The Image
      #
      # No push.
      #
      # The result is stored as an OCI image archive and passed
      # to the next job as a GitHub Actions artifact.
      # --------------------------------------------------------

      - name: Build multi-platform Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile

          platforms: linux/amd64,linux/arm64

          outputs: type=oci,dest=/tmp/clusterscope-backend.tar

          cache-from: |
            type=gha,scope=clusterscope-backend

          cache-to: |
            type=gha,mode=max,scope=clusterscope-backend

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/clusterscope-backend.tar
          retention-days: 1


  # ============================================================
  # Backend Smoke Test
  # ============================================================

  backend-smoke-test:
    name: Backend Smoke Test
    runs-on: ubuntu-latest

    needs: backend-build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/clusterscope-backend.tar

      - name: Smoke test
        run: |
          docker run -d \
            --name clusterscope-backend \
            -p 8000:8000 \
            clusterscope-backend:latest

          sleep 3

          curl --fail \
            --retry 3 \
            --retry-delay 1 \
            http://localhost:8000/healthz

      # --------------------------------------------------------
      # Always collect the test result
      #
      # IMPORTANT:
      # This does NOT hide a failure.
      # The Smoke Test step above can still fail the job.
      # --------------------------------------------------------

      - name: Collect smoke test result
        if: always()
        run: |
          {
            echo "Backend Smoke Test"
            echo "=================="
            echo ""
            echo "Health endpoint:"
            curl -sS http://localhost:8000/healthz || true
            echo ""
            echo ""
            echo "Container status:"
            docker ps -a --filter name=clusterscope-backend
            echo ""
            echo "Container inspect:"
            docker inspect clusterscope-backend \
              --format '{{.State.Status}} - ExitCode={{.State.ExitCode}}' \
              2>/dev/null || true
          } > backend-smoke-test.log

      # --------------------------------------------------------
      # Always collect Docker logs
      # --------------------------------------------------------

      - name: Collect Docker logs
        if: always()
        run: |
          docker logs clusterscope-backend \
            > backend-docker.log 2>&1 || true

      # --------------------------------------------------------
      # Always upload artifacts
      # --------------------------------------------------------

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-test-${{ github.run_id }}
          path: |
            backend-smoke-test.log
            backend-docker.log
          retention-days: 14

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f clusterscope-backend || true


  # ============================================================
  # Publish Development Image
  # ============================================================

  backend-publish-dev:
    name: Publish Backend Dev Image
    runs-on: ubuntu-latest

    needs: backend-smoke-test

    if: |
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/heads/feat/')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.push == true)

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/clusterscope-backend.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push development image
        run: |
          docker tag \
            clusterscope-backend:latest \
            ${{ env.IMAGE_NAME }}:dev

          docker tag \
            clusterscope-backend:latest \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ env.IMAGE_NAME }}:dev

          docker push \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


  # ============================================================
  # Publish Production Image
  # ============================================================

  backend-publish-latest:
    name: Publish Backend Latest Image
    runs-on: ubuntu-latest

    needs: backend-smoke-test

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image-${{ github.run_id }}
          path: /tmp/backend-image

      - name: Load Docker image
        run: |
          docker load \
            --input /tmp/backend-image/clusterscope-backend.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push production image
        run: |
          docker tag \
            clusterscope-backend:latest \
            ${{ env.IMAGE_NAME }}:latest

          docker tag \
            clusterscope-backend:latest \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ env.IMAGE_NAME }}:latest

          docker push \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}