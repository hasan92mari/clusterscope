name: Docker
on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'frontend/**'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/clusterscope-frontend:latest
            ghcr.io/${{ github.repository_owner }}/clusterscope-frontend:${{ github.sha }}

      - name: Smoke test
        run: |
          docker run -d \
            --name clusterscope \
            -p 8080:8080 \
            ghcr.io/${{ github.repository_owner }}/clusterscope-frontend:latest

          sleep 3

          curl --fail http://localhost:8080/healthz

          docker stop clusterscope

      - name: Cleanup container
        if: always()
        run: docker rm -f clusterscope