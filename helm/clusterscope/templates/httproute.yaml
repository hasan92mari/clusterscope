{{- if .Values.gateway.enabled }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clusterscope-frontend
  namespace: {{ include "clusterscope.frontendNamespace" . }}

spec:
  parentRefs:
    - name: clusterscope-gateway
      {{- if ne .Values.namespaceMode "single" }}
      namespace: {{ include "clusterscope.gatewayNamespace" . }}
      {{- end }}
      sectionName: https

  hostnames:
    - {{ .Values.gateway.hostname }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: clusterscope-frontend
          port: {{ .Values.frontend.service.port }}

{{- end }}
