{{- if .Values.redis.enabled }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clusterscope-redis
  namespace: {{ include "clusterscope.redisNamespace" . }}

spec:
  serviceName: clusterscope-redis
  replicas: {{ .Values.redis.replicas }}

  selector:
    matchLabels:
      app: clusterscope-redis

  template:
    metadata:
      labels:
        app: clusterscope-redis

    spec:
      containers:
        - name: redis

          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}

          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - "$(REDIS_PASSWORD)"

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clusterscope-redis
                  key: password

          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: redis-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.redis.storage.size }}

{{- end }}
