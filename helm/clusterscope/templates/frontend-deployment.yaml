apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterscope-frontend
  namespace: {{ include "clusterscope.frontendNamespace" . }}
  labels:
    app: clusterscope-frontend

spec:
  replicas: {{ .Values.frontend.replicas }}

  selector:
    matchLabels:
      app: clusterscope-frontend

  template:
    metadata:
      labels:
        app: clusterscope-frontend

    spec:
      serviceAccountName: clusterscope-frontend

      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - containerPort: 8080
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: APP_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']

            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: clusterscope-frontend-config
                  key: backend-url

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: clusterscope-frontend-config
                  key: redis-host

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: clusterscope-frontend-config
                  key: redis-port

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clusterscope-redis
                  key: password