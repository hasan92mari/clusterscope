apiVersion: v1
kind: Service
metadata:
  name: clusterscope-frontend
  namespace: {{ include "clusterscope.frontendNamespace" . }}
spec:
  type: ClusterIP

  selector:
    app: clusterscope-frontend

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}