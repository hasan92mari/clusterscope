{{- if .Values.backend.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterscope-backend
  namespace: {{ include "clusterscope.backendNamespace" . }}
  labels:
    app: clusterscope-backend

spec:
  replicas: {{ .Values.backend.replicas }}

  selector:
    matchLabels:
      app: clusterscope-backend

  template:
    metadata:
      labels:
        app: clusterscope-backend

    spec:
      serviceAccountName: clusterscope-backend
      containers:
        - name: backend

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - containerPort: 8000
              protocol: TCP

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: APP_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: clusterscope-postgres
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clusterscope-postgres
                  key: password

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: clusterscope-postgres
                  key: database

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: clusterscope-backend-config
                  key: postgres-host

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: clusterscope-backend-config
                  key: postgres-port

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

{{- end }}
