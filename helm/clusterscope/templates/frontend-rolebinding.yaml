apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clusterscope-frontend
  namespace: {{ include "clusterscope.frontendNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: clusterscope-frontend
    namespace: {{ include "clusterscope.frontendNamespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clusterscope-frontend