{{- if .Values.postgres.enabled }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clusterscope-postgres
  namespace: {{ include "clusterscope.postgresNamespace" . }}
  labels:
    app: clusterscope-postgres

spec:
  serviceName: clusterscope-postgres
  replicas: {{ .Values.postgres.replicas }}

  selector:
    matchLabels:
      app: clusterscope-postgres

  template:
    metadata:
      labels:
        app: clusterscope-postgres

    spec:
      containers:
        - name: postgres

          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: clusterscope-postgres
                  key: database

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: clusterscope-postgres
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clusterscope-postgres
                  key: password

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.postgres.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}

{{- end }}
