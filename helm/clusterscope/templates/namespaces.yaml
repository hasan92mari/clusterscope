{{- if eq .Values.namespaceMode "single" }}

apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.single }}

{{- else }}

apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.frontend }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.backend }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.redis }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.postgres }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.gateway }}

{{- end }}