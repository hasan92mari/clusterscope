apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterscope-frontend
  namespace: clusterscope
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clusterscope-frontend
  template:
    metadata:
      labels:
        app: clusterscope-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/hasan92mari/clusterscope-frontend:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault