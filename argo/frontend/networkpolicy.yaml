apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clusterscope-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app: clusterscope-frontend
  policyTypes:
    - Egress
  egress:
    # The former Cilium policy allowed both world and kube-apiserver egress.
    # Standard NetworkPolicy has no equivalent entity selectors, so preserve that access.
    - {}
