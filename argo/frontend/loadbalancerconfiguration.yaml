apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: clusterscope-frontend-alb
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scheme: internet-facing
  listenerConfigurations:
    - protocolPort: "HTTPS:443"
      # Copy the value from `terraform output -raw cluster_demo_tls_certificate_arn`.
      # The certificate is self-signed, so clients will show a trust warning.
      defaultCertificate: arn:aws:acm:eu-north-1:992189742733:certificate/a5e1fc4f-6d66-4483-a241-ab1857862475 #REPLACE_WITH_CLUSTER_DEMO_TLS_CERTIFICATE_ARN
