apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: clusterscope-project
  namespace: argocd
spec:
  description: Project for Clusterscope frontend and backend workloads
  sourceRepos:
    - https://github.com/hasan92mari/clusterscope.git
  destinations:
    - namespace: clusterscope-*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: "rbac.authorization.k8s.io"
      kind: Role
    - group: "rbac.authorization.k8s.io"
      kind: RoleBinding
    - group: "gateway.networking.k8s.io"
      kind: Gateway
    - group: "gateway.networking.k8s.io"
      kind: HTTPRoute
  clusterResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  roles:
    - name: dev-readonly
      description: Read-only access for developers
      policies:
        - p, proj:app1-project:dev-readonly, applications, get, app1-project/*, allow
      groups:
        - app1-devs
    - name: platform-admin
      description: Full control for platform team
      policies:
        - p, proj:app1-project:platform-admin, applications, *, app1-project/*, allow
      groups:
        - platform-team
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusterscope
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/hasan92mari/clusterscope.git
              revision: HEAD
              directories:
                - path: argo/*
                - path: argo/argocd-crds
                  exclude: true
          - list:
              elements:
                - Name: prod
                  branch: main
                # - Name: dev
                #   branch: feat/add-argocd-crds
  template:
    metadata:
      name: 'clusterscope-{{.Name}}-{{.path.basename}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: clusterscope-project
      source:
        repoURL: https://github.com/hasan92mari/clusterscope.git
        targetRevision: '{{.branch}}'
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'clusterscope-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
