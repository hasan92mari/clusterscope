apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clusterscope-backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      app: clusterscope-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clusterscope-frontend
          podSelector:
            matchLabels:
              app: clusterscope-frontend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Preserve the former Cilium world and kube-apiserver egress access.
    - {}
